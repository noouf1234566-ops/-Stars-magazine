<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلة نجوم القيم والسلوك</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&display=swap">
<style>
:root{--bg:#fdf0f5;--bg2:#fbe3ee;--card:rgba(255,250,252,.88);--ink:#4a2335;--soft:#8a6575;--blue:#c0568a;--navy:#8e2f63;--gold:#e8b86d;--green:#2f9e6b;--red:#d33;--line:#f6d5e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1422;--bg2:#1c0d16;--card:rgba(58,31,47,.88);--ink:#fde9f1;--soft:#d9b3c5;--line:#5a3047}}
:root[data-theme="dark"]{--bg:#2a1422;--bg2:#1c0d16;--card:rgba(58,31,47,.88);--ink:#fde9f1;--soft:#d9b3c5;--line:#5a3047}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;color:var(--ink);font-family:Almarai,Tahoma,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px;position:relative;z-index:1}
.hero{border-radius:28px;padding:28px 16px;text-align:center;color:#fff;background:linear-gradient(160deg,#dc78a5,#a2406f);margin-bottom:14px;box-shadow:0 10px 30px rgba(162,64,111,.25)}
.hero h1{margin:6px 0;font-size:34px;line-height:1.4;font-family:Amiri,Almarai,serif}.hero p{margin:4px 0}
.mascot{font-size:54px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 6px 18px rgba(192,86,138,.08)}
.btn{border:0;border-radius:30px;padding:10px 22px;font:inherit;font-weight:800;background:var(--gold);color:#4a2335;cursor:pointer}
.btn.alt{background:var(--card);border:2px solid var(--line);color:var(--ink)}
input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin:6px 0}
.stat{display:flex;gap:10px;align-items:center;font-weight:800}
.track{flex:1;height:12px;background:var(--line);border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--gold);transition:width .4s}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.door{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;font-weight:700}
.door .ic{font-size:32px;display:block}.door small{display:block;color:var(--soft);font-weight:400;line-height:1.4}
.door.done{border-color:var(--gold)}.door.done::after{content:"✔";position:absolute;top:6px;left:10px;color:var(--green);font-weight:800}
h2{color:var(--blue);margin:8px 0;font-family:Amiri,Almarai,serif;font-size:24px}
.opt{display:block;width:100%;text-align:right;margin:6px 0;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--green);background:rgba(20,160,79,.15)}.opt.bad{border-color:var(--red);background:rgba(220,50,50,.12)}.opt:disabled{opacity:.7}
.msg{font-weight:800;margin:8px 0}.good{color:var(--green)}.hint{color:var(--red)}
.steps{display:flex;gap:6px;margin-bottom:10px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--blue)}
.pass{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;font-size:12px}
.stamp{border:2px dashed var(--line);border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.45}
.stamp.on{opacity:1;border:2px solid var(--gold);background:rgba(255,201,40,.2)}.stamp b{font-size:22px}
.cert{text-align:center;border:3px double var(--gold)}.big{font-size:24px;font-weight:800;color:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
footer{text-align:center;color:var(--soft);font-size:12px;padding:12px}
.pop{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--gold);color:#4a2335;font-weight:800;padding:8px 18px;border-radius:30px;z-index:9;animation:pop 1.6s forwards}
#flw{position:fixed;inset:0;z-index:0;pointer-events:none}#flw svg{width:100%;height:100%;display:block}
.top{display:flex;justify-content:flex-start;margin:2px 0 10px}.lg{height:54px;width:auto;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lg{background:rgba(255,255,255,.92);border-radius:12px;padding:4px 8px}}
.bot{width:74px;flex:none;animation:bob 3s ease-in-out infinite}.bot svg{display:block;width:100%;height:auto}
.botrow{display:flex;align-items:flex-start;gap:12px;margin:6px 0 10px}
.bubble2{position:relative;flex:1;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;margin-top:10px}
.bubble2::before{content:"";position:absolute;right:-8px;top:20px;width:13px;height:13px;background:var(--card);border-right:1.5px solid var(--line);border-top:1.5px solid var(--line);transform:rotate(45deg)}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.bot,.eyes{animation:none}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-10px) scale(.8)}15%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}
#bf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.b{position:absolute;bottom:-60px;animation:fly var(--d) linear infinite;animation-delay:var(--dl)}
.b svg{display:block;width:100%;height:auto;animation:flap .6s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
@keyframes fly{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(40px,-25vh) rotate(10deg)}50%{transform:translate(-30px,-55vh) rotate(-10deg)}75%{transform:translate(35px,-80vh) rotate(8deg)}100%{transform:translate(0,-118vh) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){#bf{display:none}}
</style>
</head>

<div id="bf" aria-hidden="true"></div>
